# This workflow builds SystemTray with the CommandBox task runner (build.bx) and publishes the jar
# to the Ortus downloads bucket.

name: SystemTray CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # We get the required keys
  workflow_call:
    secrets:
      AWS_ACCESS_KEY:
        required: true
      AWS_ACCESS_SECRET:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    # The task runner compiles with javac (bytecode target 11)
    - name: Set up JDK 21
      uses: actions/setup-java@v2
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install CommandBox
      run: |
        curl -fsSl https://downloads.ortussolutions.com/debs/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/ortussolutions.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/ortussolutions.gpg] https://downloads.ortussolutions.com/debs-be/noarch /" | sudo tee /etc/apt/sources.list.d/commandbox.list
        sudo apt-get update && sudo apt-get install -y apt-transport-https commandbox
        # box bootstraps BoxLang on first run and records its location in ~/.bash_profile, so pick that up
        source /home/runner/.bash_profile
        box version

    # Do the build
    - name: Build with the task runner
      run: |
        source /home/runner/.bash_profile
        box task run build

    # The task lays the jar out at dist/release/<version>/systemtray-<version>.jar, which is
    # exactly the bucket layout, so the upload is a straight sync of that folder
    - name: Upload JAR to S3

      # Run the upload on master
      if: ${{ github.ref == 'refs/heads/master' }}

      uses: jakejarvis/s3-sync-action@master
      with:
        args: --acl public-read
      env:
        AWS_S3_BUCKET: "downloads.ortussolutions.com"
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
        SOURCE_DIR: "dist/release/"
        DEST_DIR: "dorkbox/systemtray"
